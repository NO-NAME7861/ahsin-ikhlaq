name: Weekly Learning Check

# Sundays at 09:00 PKT (04:00 UTC). Pulls views for recent uploads
# via YouTube API and updates state/learning.json.

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install google-api-python-client google-auth

      - name: Decode YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: echo "$YOUTUBE_TOKEN_JSON" | base64 -d > token.json

      - name: Pull views for recent episodes
        run: python learning_check.py

      - name: Commit updated learning.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          if git diff --quiet state/learning.json; then
            echo "no changes to learning.json"
          else
            git add state/learning.json
            git commit -m "chore: weekly learning report"
            git push origin main
            echo "pushed learning.json"
          fi
