name: Daily Quizzes

on:
  schedule:
    # 1 quiz batch per day at 10:30 AM PKT = 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-quizzes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate 2 quizzes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
        run: python generate_quiz.py
