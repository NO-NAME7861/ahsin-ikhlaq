name: Daily Universe Explorer Upload

on:
  schedule:
    # 2 long episodes per day (quota-safe: 2 long + 3 shorts = 5 uploads/day,
    # ~8,600 of YouTube's 10,000 daily API units).
    # 8:00 / 8:30 PM PKT = 15:00 / 15:30 UTC
    - cron: "0,30 15 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload privacy"
        required: true
        default: "private"
        type: choice
        options: ["private", "public", "unlisted"]
      episode_index:
        description: "Force a specific episode ID (e.g. 007)"
        required: false
        default: ""
        type: string
      target_minutes:
        description: "Video length in minutes (12 = default; 30/50 now allowed after channel verification)"
        required: false
        default: ""
        type: string
      narration_lang:
        description: "Narration language: hi = Romanized Hindi-Urdu, en = English"
        required: false
        default: "hi"
        type: choice
        options: ["hi", "en"]
      episode_topic:
        description: "One-off topic override (leave empty to use episodes.csv rotation)"
        required: false
        default: ""
        type: string
      episode_moral:
        description: "One-off central insight for the topic override (optional)"
        required: false
        default: ""
        type: string
      max_minutes:
        description: "Safety cap on narration length in minutes (default 14.2; use 55 for long videos)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: universe-episode
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-ui-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decode YouTube token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > token.json
          test -s token.json && echo "token.json OK"

      - name: Generate episode and upload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-IN-NeerjaExpressiveNeural' }}
          PRIVACY_STATUS: ${{ inputs.privacy || vars.PRIVACY_STATUS || 'public' }}
          EPISODES_CSV: ${{ vars.EPISODES_CSV || 'episodes.csv' }}
          EPISODE_INDEX: ${{ inputs.episode_index || '' }}
          TARGET_MINUTES: ${{ inputs.target_minutes || vars.TARGET_MINUTES || '12' }}
          NARRATION_LANG: ${{ inputs.narration_lang || 'hi' }}
          EPISODE_TOPIC: ${{ inputs.episode_topic || '' }}
          EPISODE_MORAL: ${{ inputs.episode_moral || '' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '14.2' }}
          N_IMAGES: ${{ vars.N_IMAGES || '' }}
          UPLOAD: "1"
        run: python generate_episode.py

      - name: Save progress state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python update_state.py

      - name: Upload work artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-work
          path: |
            work/*.json
            work/*.txt
            work/*.srt
          retention-days: 14
