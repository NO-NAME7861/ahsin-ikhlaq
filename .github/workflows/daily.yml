name: Daily Universe Explorer Upload

on:
  schedule:
    # 3 episodes per day, 8:00 / 8:20 / 8:40 PM PKT = 15:00 / 15:20 / 15:40 UTC
    - cron: "0,20,40 15 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload privacy"
        required: true
        default: "private"
        type: choice
        options: ["private", "public", "unlisted"]
      episode_index:
        description: "Force a specific episode ID (e.g. 007)"
        required: false
        default: ""
        type: string
      target_minutes:
        description: "Video length in minutes (12 = safe for unverified channels, since videos >15:00 are rejected)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: universe-episode
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-ui-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decode YouTube token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > token.json
          test -s token.json && echo "token.json OK"

      - name: Generate episode and upload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'hi-IN-SwaraNeural' }}
          PRIVACY_STATUS: ${{ inputs.privacy || vars.PRIVACY_STATUS || 'public' }}
          EPISODES_CSV: ${{ vars.EPISODES_CSV || 'episodes.csv' }}
          EPISODE_INDEX: ${{ inputs.episode_index || '' }}
          TARGET_MINUTES: ${{ inputs.target_minutes || vars.TARGET_MINUTES || '12' }}
          N_IMAGES: ${{ vars.N_IMAGES || '' }}
          UPLOAD: "1"
        run: python generate_episode.py

      - name: Save progress state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python update_state.py

      - name: Upload work artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-work
          path: |
            work/*.json
            work/*.txt
            work/*.srt
          retention-days: 14
