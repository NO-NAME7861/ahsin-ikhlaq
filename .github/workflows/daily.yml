name: Daily Universe Explorer Upload

on:
  schedule:
    # 3 episodes per day, 10:00 / 16:00 / 23:00 PKT = 05:00 / 11:00 / 18:00 UTC
    - cron: "0 5,11,18 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload privacy"
        required: true
        default: "private"
        type: choice
        options: ["private", "public", "unlisted"]
      episode_index:
        description: "Force a specific episode ID (e.g. 007)"
        required: false
        default: ""
        type: string
      target_minutes:
        description: "Video length in minutes (22 = normal, 50 = 50-minute long-form)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: universe-episode
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-ui-core fonts-noto-nastaliq-urdu

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decode YouTube token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > token.json
          test -s token.json && echo "token.json OK"

      - name: Generate episode and upload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemma-4-31b-it:free' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'ur-PK-UzmaNeural' }}
          PRIVACY_STATUS: ${{ inputs.privacy || vars.PRIVACY_STATUS || 'public' }}
          EPISODES_CSV: ${{ vars.EPISODES_CSV || 'episodes.csv' }}
          EPISODE_INDEX: ${{ inputs.episode_index || '' }}
          TARGET_MINUTES: ${{ inputs.target_minutes || vars.TARGET_MINUTES || '22' }}
          N_IMAGES: ${{ vars.N_IMAGES || '' }}
          UPLOAD: "1"
        run: python generate_episode.py

      - name: Save progress state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/episodes.json
          git diff --cached --quiet || (git commit -m "chore: advance episode state" && git push origin HEAD:main)

      - name: Upload work artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-work
          path: |
            work/*.json
            work/*.txt
            work/*.srt
          retention-days: 14
