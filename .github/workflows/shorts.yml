name: Daily Universe Shorts

on:
  schedule:
    # 5 shorts per day: 07:05 / 09:05 / 11:05 / 13:05 / 15:05 UTC
    # (YouTube's upload cap resets at midnight Pacific = 1 PM PKT, so shorts
    # slots must stay before 1 PM PKT to avoid uploadLimitExceeded)
    - cron: "5 7,9,11,13,15 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload privacy"
        required: true
        default: "private"
        type: choice
        options: ["private", "public", "unlisted"]
      shorts_topic:
        description: "Force a short topic (optional)"
        required: false
        default: ""
        type: string
      narration_lang:
        description: "Narration language: hi = Romanized Hindi-Urdu, en = English, ur = pure Roman Urdu"
        required: false
        default: "hi"
        type: choice
        options: ["hi", "en", "ur"]

permissions:
  contents: write

concurrency:
  group: universe-shorts
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decode YouTube token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > token.json
          test -s token.json && echo "token.json OK"

      - name: Generate short and upload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-IN-NeerjaExpressiveNeural' }}
          PRIVACY_STATUS: ${{ inputs.privacy || vars.PRIVACY_STATUS || 'public' }}
          SHORTS_TOPIC: ${{ inputs.shorts_topic || '' }}
          NARRATION_LANG: ${{ inputs.narration_lang || vars.NARRATION_LANG || 'hi' }}
          UPLOAD: "1"
        run: python generate_short.py

      - name: Save shorts state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/shorts.json
          if git diff --cached --quiet; then
            echo "shorts state unchanged"
          else
            git commit -m "chore: advance shorts state"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload work artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-work
          path: |
            work_shorts/*.json
            work_shorts/*.txt
            work_shorts/*.srt
          retention-days: 14
